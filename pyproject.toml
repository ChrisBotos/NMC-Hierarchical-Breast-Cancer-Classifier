[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nmc-hierarchical-breast-cancer-classifier"
version = "0.1.0"
description = "Hierarchical nearest-mean classifier for breast cancer molecular subtypes from discrete aCGH copy-number profiles."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alexandros Michailidis"},
    {name = "Antonie Wagner"},
    {name = "Christos Botos"},
    {name = "Yan Qiao"},
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-learn>=1.1",
    "joblib>=1.2",
    "statsmodels>=0.13",
    "rich>=13.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "python-docx>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.black]
line-length = 88
target-version = ["py310"]
# Kept byte-for-byte as the course issued it.
extend-exclude = "code/predictions_file_format_check_v2\\.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is left to black.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Every analysis script lives in code/ and reaches its shared helpers by
# inserting code/ onto sys.path before importing them, because this is a
# directory of scripts rather than an installed package. That bootstrap has
# to run before the import it enables, so E402 is structural here.
"code/*.py" = ["E402"]
# Provided by the course as the reference checker for the submission format
# and kept verbatim, so its style is not ours to change.
"code/predictions_file_format_check_v2.py" = ["E402", "E722", "E712", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
