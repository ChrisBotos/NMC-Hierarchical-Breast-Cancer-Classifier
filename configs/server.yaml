# Server configuration for final hierarchical nested CV run.
# 10 pipeline variants x 200 repeats = 2000 SLURM array tasks.
# Seeds 1001-1200 to avoid overlap with earlier runs (seeds 1-50).

cv:
  n_repeats: 200
  seed_start: 1001
  outer_folds: 5
  inner_folds: 5
  scoring: balanced_accuracy

pipelines:
  names: [kw_nmc, en_nmc, kw_rf, en_rf, standalone_en, nmc_ensemble, kw_nmc_pens, standalone_en_pens, en_nmc_pens, nmc_pens_ensemble]
  rf_n_estimators: 500
  rf_class_weight: balanced
  nmc_class_weight: balanced

# Stage 1 threshold calibration parameters.
stage1:
  threshold_range: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  inner_folds: 5

# Suspected mislabel samples for sensitivity analysis.
suspected_mislabels:
  indices: [2, 4, 45]
  names: ["Array.67", "Array.22", "Array.113"]

# Production grids with dense search.
# EN selector__C values are np.logspace(-3, 2, 10).
grids:
  kw_nmc:
    selector__k: [5, 10, 15, 20, 30, 50, 75, 100]
    clf__shrink_threshold: [null, 0.1, 0.2, 0.5]
  kw_rf:
    selector__k: [5, 10, 15, 20, 30, 50, 75, 100]
    clf__max_features: ["sqrt", 0.3]
    clf__min_samples_leaf: [1, 5]
  en_nmc:
    selector__C: [0.001, 0.00359381, 0.0129155, 0.0464159, 0.16681, 0.599484, 2.15443, 7.74264, 27.8256, 100.0]
    selector__l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
    selector__top_k: [5, 10, 20, 50]
    clf__shrink_threshold: [null, 0.1, 0.2, 0.5]
  en_rf:
    selector__C: [0.001, 0.00359381, 0.0129155, 0.0464159, 0.16681, 0.599484, 2.15443, 7.74264, 27.8256, 100.0]
    selector__l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
    selector__top_k: [5, 10, 20, 50]
    clf__max_features: ["sqrt", 0.3]
    clf__min_samples_leaf: [1, 5]
  standalone_en:
    clf__C: [0.001, 0.00359381, 0.0129155, 0.0464159, 0.16681, 0.599484, 2.15443, 7.74264, 27.8256, 100.0]
    clf__l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
  # Plateau ensemble pipelines (_pens) have no grids of their own.
  # They pool inner CV results from their base pipeline's completed folds.
  # Post-hoc ensemble pipelines (nmc_ensemble, nmc_pens_ensemble) have no grids.
  # They average 3-class probabilities from completed component fold results.

preprocessing:
  merge_threshold: 0.8

environment:
  conda_prefix: "${HOME}/miniconda3"
  conda_env: "tb_310"

slurm:
  mem: "4G"
  time: "2-00:00:00"
  cpus_per_task: 1
  max_concurrent_jobs: 50
  mail_user: "your.email@example.com"
