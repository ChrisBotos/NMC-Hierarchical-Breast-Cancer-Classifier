# code/predictions_file_format_check_v2.py is the submission-format checker
# provided by the course. It is kept byte-for-byte as issued so that it can be
# diffed against the original, so every hook that would rewrite it excludes it.
exclude: ^code/predictions_file_format_check_v2\.py$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
