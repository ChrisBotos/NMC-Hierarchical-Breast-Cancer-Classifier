# Plateau ensemble size comparison experiment.
# Runs en_nmc_pens with 3 MAX_PLATEAU_SIZE values (50, 200, all)
# to measure impact on Stage 2 balanced accuracy.
# Uses same seeds as server.yaml (1001-1200) for paired comparison.

cv:
  n_repeats: 200
  seed_start: 1001
  outer_folds: 5
  inner_folds: 5
  scoring: balanced_accuracy

pipelines:
  names: [en_nmc_pens]
  rf_n_estimators: 500
  rf_class_weight: balanced
  nmc_class_weight: balanced

# Stage 1 threshold calibration parameters (unused for pens, kept for schema).
stage1:
  threshold_range: [0.50]
  inner_folds: 5

# Suspected mislabel samples for sensitivity analysis.
suspected_mislabels:
  indices: [2, 4, 45]
  names: ["Array.67", "Array.22", "Array.113"]

# No grids needed - pens pools from base en_nmc inner CV results.
grids: {}

preprocessing:
  merge_threshold: 0.8

environment:
  conda_prefix: "${HOME}/miniconda3"
  conda_env: "tb_310"

slurm:
  mem: "4G"
  time: "0-04:00:00"
  cpus_per_task: 1
  max_concurrent_jobs: 50
  mail_user: "your.email@example.com"
